# Blueprint Render de démonstration (stockage SQLite éphémère sur plan gratuit).
services:
  - type: web
    name: dakhla-home-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
